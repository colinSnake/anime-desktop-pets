name: Cross-platform foundation
on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/app-service/**'
      - 'apps/workspace-ui/**'
      - 'apps/runtime-bridge/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.node-version'
      - 'scripts/*cross-platform*'
      - 'scripts/test-runtime-bridge.mjs'
      - 'scripts/test-workspace-config.test.mjs'
      - 'scripts/test-qt-report.test.mjs'
      - 'scripts/test-build-output.test.mjs'
      - 'scripts/qt-preflight-report.mjs'
      - 'scripts/check-qt-runtime.mjs'
      - '.github/workflows/cross-platform.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    name: Foundation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:cross-platform
      # 不启动 Electron、Qt 桌宠或音频；本矩阵不构成桌面/发行验收。

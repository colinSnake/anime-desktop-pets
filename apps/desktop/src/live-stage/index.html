<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>主播直播舞台</title><link rel="stylesheet" href="stage.css"><script src="stage.js" defer></script></head><body>
<main id="stage" data-scene="desk-room" hidden aria-label="主播直播舞台">
  <img id="room" alt="" draggable="false">
  <video id="idle" muted loop playsinline disablepictureinpicture></video>
  <video id="action" muted playsinline disablepictureinpicture hidden></video>
  <img id="desk" alt="" draggable="false">
  <div id="dialogue" hidden><span id="line"></span></div>
</main>
<p id="status" role="status">舞台准备中</p>
</body></html>
